<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#1a1a2e" stroke="#e94560" stroke-width="12"/>
  <!-- Clock face inner circle -->
  <circle cx="256" cy="256" r="200" fill="#16213e" stroke="#0f3460" stroke-width="4"/>
  <!-- Hour markers -->
  <g stroke="#e94560" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="76" x2="256" y2="106"/>
    <line x1="256" y1="406" x2="256" y2="436"/>
    <line x1="76" y1="256" x2="106" y2="256"/>
    <line x1="406" y1="256" x2="436" y2="256"/>
  </g>
  <!-- Minor hour markers (完整版) -->
  <g stroke="#0f3460" stroke-width="3" stroke-linecap="round">
    <!-- 1点 (30°) -->
    <line x1="356" y1="83" x2="349" y2="101"/>
    <!-- 2点 (60°) -->
    <line x1="429" y1="156" x2="412" y2="166"/>
    <!-- 4点 (120°) -->
    <line x1="429" y1="356" x2="412" y2="346"/>
    <!-- 5点 (150°) -->
    <line x1="356" y1="429" x2="349" y2="411"/>
    <!-- 7点 (210°) -->
    <line x1="156" y1="429" x2="163" y2="411"/>
    <!-- 8点 (240°) -->
    <line x1="83" y1="356" x2="100" y2="346"/>
    <!-- 10点 (300°) -->
    <line x1="83" y1="156" x2="100" y2="166"/>
    <!-- 11点 (330°) -->
    <line x1="156" y1="83" x2="163" y2="101"/>
  </g>
  <!-- Hour hand (pointing to ~10:10) -->
  <line x1="256" y1="256" x2="196" y2="146" stroke="#e94560" stroke-width="14" stroke-linecap="round"/>
  <!-- Minute hand (pointing to ~10:10) -->
  <line x1="256" y1="256" x2="316" y2="146" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="12" fill="#e94560"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff"/>
</svg>
